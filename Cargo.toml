[package]
name = "ws"
version = "0.1.0"
edition = "2021"
description = "Multi-repo git worktree workspaces with tmux/herdr, fzf and zoxide integration"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
strip = true
