[package]
name = "ws"
version = "0.5.0"
edition = "2021"
description = "Multi-repo git worktree workspaces with tmux/herdr, fzf and zoxide integration"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.11"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shell-words = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
strip = true
