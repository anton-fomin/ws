name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: cargo test --locked

      - run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="ws-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "$name" -C target/release ws
          sha256sum "$name" > SHA256SUMS
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            --title "${{ steps.package.outputs.tag }}" \
            --generate-notes \
            "${{ steps.package.outputs.asset }}" \
            SHA256SUMS
